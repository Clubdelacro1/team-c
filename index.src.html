<title>Cocina de Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de una columna para el celular — encabezado con el evento, contenido por pestaña, barra de pestañas fija abajo */
:root{
  --bg:#F4F2F7; --panel:#FFFFFF; --ink:#1D1726; --muted:#675F73; --line:#E1DCE8;
  --accent:#5B3A8C; --accent-ink:#FFFFFF; --accent-soft:#ECE5F6;
  --veg:#2E7D4F; --veg-soft:#E2F2E8; --meat:#B03A2E; --meat-soft:#F8E3E0;
  --warn:#8A5A00; --warn-soft:#FBEFD2; --done:#8C8597;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --panel:#1E1826; --ink:#ECE7F3; --muted:#A79FB3; --line:#332B3E;
  --accent:#B79BE8; --accent-ink:#1A1222; --accent-soft:#2D2340;
  --veg:#6CC793; --veg-soft:#1B3326; --meat:#EE8B7F; --meat-soft:#3D2120;
  --warn:#E8B95A; --warn-soft:#3A2E14; --done:#7C7488; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141019; --panel:#1E1826; --ink:#ECE7F3; --muted:#A79FB3; --line:#332B3E;
  --accent:#B79BE8; --accent-ink:#1A1222; --accent-soft:#2D2340;
  --veg:#6CC793; --veg-soft:#1B3326; --meat:#EE8B7F; --meat-soft:#3D2120;
  --warn:#E8B95A; --warn-soft:#3A2E14; --done:#7C7488; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-family:var(--display);font-size:17px;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.top{display:grid;gap:10px}
.toprow{display:flex;gap:8px;align-items:center}
.toprow select{flex:1;font-weight:700;font-size:16px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 14px;font-weight:700;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--meat);color:var(--meat)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.wrap > *{min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:clamp(13px,3.7vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.group{display:grid;gap:8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;vertical-align:2px;margin-left:4px;text-transform:uppercase;letter-spacing:.04em}
.pill.veggie{background:var(--veg-soft);color:var(--veg)}
.pill.carne{background:var(--meat-soft);color:var(--meat)}
.pill.general{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.stepper button{border:0;background:transparent;width:36px;height:38px;font-size:20px;cursor:pointer;color:var(--accent)}
.stepper input{width:56px;border:0;border-radius:0;text-align:center;padding:8px 0;font-family:var(--mono);font-size:16px;background:transparent}
.qty{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;cursor:pointer;flex-shrink:0;display:grid;place-items:center;color:var(--accent-ink);font-weight:700}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.row.done .name,.row.done .qty{color:var(--done);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.recwrap{border-top:1px solid var(--line)}
.recwrap:first-child{border-top:0}
.recwrap > .row{border-top:0}
.ingtoggle{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:700;padding:0 14px 10px;cursor:pointer;width:100%;text-align:left}
.ingtoggle .chev{display:inline-block;transition:transform .25s ease}
.ingpanel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.ingpanel > div{overflow:hidden;min-height:0}
.recwrap.open .ingpanel{grid-template-rows:1fr}
.recwrap.open .ingtoggle .chev{transform:rotate(180deg)}
@media (hover:hover){.recwrap:hover .ingpanel{grid-template-rows:1fr}.recwrap:hover .ingtoggle .chev{transform:rotate(180deg)}.recwrap:hover{background:var(--accent-soft)}}
.inglist{list-style:none;margin:0;padding:0 14px 12px;display:grid;grid-template-columns:1fr;max-width:520px;font-size:14px}
.inglist li{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.inglist .in{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:1.6em;text-align:right}
.inglist .nm{flex:1;min-width:0}
.inglist .iq{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.ingpanel,.ingtoggle .chev{transition:none}}
.note{font-size:13px;color:var(--muted)}
.detail{padding:0 14px 12px 50px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.linkish{background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:640px;width:100%}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 4px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;display:grid;justify-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,6,16,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ing{display:grid;grid-template-columns:1fr 92px 36px;gap:6px;align-items:start}
.ing .unit{font-size:12px;color:var(--muted);padding:2px 2px 0}
.ing .newi{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--warn-soft);border-radius:10px;padding:8px}
.ing .newi p{grid-column:1/-1;margin:0;font-size:13px;color:var(--warn)}
.x{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);height:42px}
.alert{border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}
.alert.err{background:var(--meat-soft);color:var(--meat)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.delp{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:10px;height:40px;min-width:40px;padding:0 8px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;font-weight:700;font-size:13px}
.delp svg{width:20px;height:20px}
.delp.sure{background:var(--meat);color:var(--bg);border-color:var(--meat)}
.toast .undo{background:transparent;border:0;color:var(--accent-soft);font-weight:700;text-decoration:underline;cursor:pointer;margin-left:6px}
@media (max-width:420px){.row{gap:8px;padding:12px 10px}.stepper button{width:30px}.stepper input{width:46px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:40;font-size:14px}
@media (max-width:380px){.stats b{font-size:19px}.ing{grid-template-columns:1fr 80px 32px}}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.check{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="toprow">
      <h1>Cocina de Eventos</h1>
    </div>
    <div class="toprow">
      <select id="evSel" aria-label="Evento"></select>
      <a class="btn ghost sm" id="evLink" target="_blank" rel="noopener" title="Abrir este evento en otra pestaña" aria-label="Abrir este evento en otra pestaña">↗</a>
      <button class="btn ghost sm" id="evNew">+ Evento</button>
    </div>
  </header>
  <main id="view"><div class="empty">Cargando tu recetario…</div></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="menu" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Menú</button>
    <button data-tab="compras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Compras</button>
    <button data-tab="equipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 11h20M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/></svg>Equipo</button>
    <button data-tab="recetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Recetas</button>
  </div>
</nav>
<div id="sheetRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const CATS = ["Verduleria","Carnes","Lacteos","Almacen","Secos / Granos","Panaderia","Condimentos","Limpieza"];
  const CAT_LABEL = {"Verduleria":"Verdulería","Carnes":"Carnes","Lacteos":"Lácteos","Almacen":"Almacén","Secos / Granos":"Secos y granos","Panaderia":"Panadería","Condimentos":"Condimentos y básicos","Limpieza":"Limpieza y descartables"};
  const GRUPOS_UT = ["Cocción y gas","Ollas y sartenes","Preparación","Servicio","Guardado y agua","Higiene y seguridad","Equipo de cocina"];
  const TIPOS = {veggie:"Veggie", carne:"Carne", general:"Para todos"};
  const STOP = new Set(["de","con","y","la","el","los","las","al","a","en","para","p"]);
  const $ = id => document.getElementById(id);
  const S = { insumos:{}, recetas:{}, eventos:{}, utensilios:{}, config:{}, evId:null, tab:"menu", loaded:0, faltan:true, q:"", tipoF:"", open:{} };
  let db = null;
  try { S.tab = localStorage.getItem("cocina-tab") || "menu"; S.evId = localStorage.getItem("cocina-ev"); } catch(e){}
  // cada evento tiene su propio link: la dirección de la app + "#" + el id del evento
  const APP_URL = "https://claude.ai/artifact/RQbN2iKi9EotK4FefWScDe";
  const linkEvento = id => APP_URL + "#" + id;
  const hashEv = () => { try { return decodeURIComponent((location.hash || "").slice(1)); } catch(e){ return ""; } };
  if (hashEv()) { S.evId = hashEv(); S.tab = "menu"; }
  window.addEventListener("hashchange", () => { if (hashEv() && S.eventos[hashEv()]) { S.evId = hashEv(); render(); } });

  // ---------- utilidades ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const slug = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  const nf = (n, d) => n.toLocaleString("es-AR", {maximumFractionDigits:d, minimumFractionDigits:0});
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  function plural(w, n){ if (n === 1 || !w) return w; if (/[aeiouáéó]$/.test(w)) return w + "s"; if (/ón$/.test(w)) return w.replace(/ón$/,"ones"); return w + "es"; }
  function fmtQty(ins, total){
    if (!total) return "a criterio";
    if (ins && ins.unidad === "u"){ const n = Math.max(1, Math.ceil(total - 1e-9)); return n + " " + plural(ins.etiqueta || "u.", n); }
    if (total >= 1000) return nf(Math.ceil(total/100)/10, 1) + " " + uGrande(ins);
    return nf(Math.ceil(total/10)*10, 0) + " " + uBase(ins);
  }
  // ---------- precios y presupuesto ----------
  const uBase = ins => ins && ins.unidad === "ml" ? "ml" : "g";
  const uGrande = ins => ins && ins.unidad === "ml" ? "L" : "kg";
  const uPrecio = ins => ins && ins.unidad === "u" ? (ins.etiqueta || "unidad") : ins && ins.unidad === "ml" ? "litro" : "kg";
  const money = n => "$" + Math.round(n).toLocaleString("es-AR");
  const tienePrecio = ins => ins && Number(ins.precio) > 0;
  // costo de compra: con las cantidades redondeadas como en la lista (kg de a 100 g, unidades enteras)
  // presentaciones del mayorista: busca la combinación más barata (un tamaño grande + el resto en otro tamaño) que cubra lo necesario
  function planCompra(ins, total){
    const ps = (ins && ins.presentaciones || []).filter(p => p.tam > 0 && p.precio > 0).slice().sort((a, b) => a.tam - b.tam);
    if (!ps.length || !(total > 0)) return null;
    let mejor = null;
    const probar = items => {
      const comprado = items.reduce((s, x) => s + x.n * x.p.tam, 0), costo = items.reduce((s, x) => s + x.n * x.p.precio, 0);
      if (comprado + 1e-9 < total) return;
      if (!mejor || costo < mejor.costo - 0.5 || (Math.abs(costo - mejor.costo) <= 0.5 && comprado < mejor.comprado)) mejor = { items: items.filter(x => x.n > 0), comprado, costo };
    };
    ps.forEach(G => {
      probar([{ p: G, n: Math.ceil(total / G.tam - 1e-9) }]);
      const nG = Math.floor(total / G.tam + 1e-9), falta = total - nG * G.tam;
      if (falta > 1e-9) ps.forEach(C => { if (C !== G) probar([{ p: G, n: nG }, { p: C, n: Math.ceil(falta / C.tam - 1e-9) }]); });
    });
    if (!mejor) return null;
    mejor.texto = mejor.items.map(x => x.n + " × " + x.p.nombre).join(" + ");
    mejor.sobra = mejor.comprado - total;
    return mejor;
  }
  function costoCompra(ins, total){
    const plan = planCompra(ins, total); if (plan) return plan.costo;
    if (!tienePrecio(ins) || !total) return 0;
    if (ins.unidad === "u") return Math.max(1, Math.ceil(total - 1e-9)) * ins.precio;
    return Math.ceil(total/100)/10 * ins.precio;
  }
  // costo teórico de una cantidad exacta (para el costo por persona de cada plato)
  function costoExacto(ins, cant){ if (!tienePrecio(ins)) return 0; return ins.unidad === "u" ? cant * ins.precio : cant / 1000 * ins.precio; }
  function costoReceta(r){ let s = 0, falta = 0; (r?.items || []).forEach(it => { const ins = S.insumos[it.insumo]; if (it.cant && !tienePrecio(ins)) falta++; s += costoExacto(ins, Number(it.cant) || 0); }); return { s, falta }; }
  // gastos reales del evento (tickets): cada renglón puede ir atado a un insumo, con la cantidad comprada en su unidad base
  function gastosEv(e){
    const porIns = {}, cantIns = {}; let total = 0;
    (e?.gastos || []).forEach(t => (t.items || []).forEach(it => { const m = Number(it.importe) || 0; total += m;
      if (it.insumo){ porIns[it.insumo] = (porIns[it.insumo] || 0) + m; cantIns[it.insumo] = (cantIns[it.insumo] || 0) + (Number(it.cant) || 0); } }));
    return { total, porIns, cantIns };
  }
  // lo que falta comprar de un insumo: si se compró sin cantidad (limpieza, a ojo) se da por cubierto
  function restante(g, k, need){
    if (g.porIns[k] == null) return need;
    const c = g.cantIns[k]; if (!(c > 0)) return 0;
    const f = need - c; return f > need * 0.03 ? f : 0;
  }
  // costo de un insumo: lo gastado en tickets + lo que falta comprar al precio estimado
  const costoIns = (ins, k, need, g) => (g.porIns[k] || 0) + costoCompra(ins, restante(g, k, need));
  function presupuesto(e, soloFalta){
    const tot = compute(e), tengo = e?.tengo || {}, g = gastosEv(e); let s = soloFalta ? 0 : g.total, sin = 0;
    Object.keys(tot).forEach(k => { if (soloFalta && tengo[k]) return; const ins = S.insumos[k]; const f = restante(g, k, tot[k].total); if (f && !tienePrecio(ins)) sin++; s += costoCompra(ins, f); });
    return { s, sin, gastado: g.total };
  }
  const precioLabel = ins => tienePrecio(ins) ? money(ins.precio) + (" por " + uPrecio(ins)) : "sin precio";

  function fmtPorcion(ins, cant){
    if (!cant) return "falta gramaje";
    if (ins && ins.unidad === "u") return nf(cant, 3) + " " + plural(ins.etiqueta || "u.", cant) + " por persona";
    return nf(cant, 1) + " " + uBase(ins) + " por persona";
  }
  function undoToast(msg, undo){
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const t = document.createElement("div"); t.className = "toast";
    t.innerHTML = `<span>${esc(msg)}</span> <button class="undo">Deshacer</button>`;
    t.querySelector(".undo").onclick = () => { t.remove(); undo(); };
    document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
  }
  function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
  function tokens(name){ return new Set(slug(name).split("-").filter(w => w && !STOP.has(w))); }
  function jaccard(a, b){ if (!a.size && !b.size) return 0; let i = 0; a.forEach(x => { if (b.has(x)) i++; }); return i / (a.size + b.size - i); }
  function lev(a, b){ const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({length:n+1}, (_, j) => j); for (let i = 1; i <= m; i++){ const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j]+1, c[j-1]+1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); p = c; } return p[n]; }
  const ev = () => S.eventos[S.evId];
  const recetasOrden = () => Object.entries(S.recetas).sort((a, b) => a[1].nombre.localeCompare(b[1].nombre, "es"));

  // ---------- cálculo de compras ----------
  function compute(e){
    const out = {};
    (e?.platos || []).forEach(p => {
      const r = S.recetas[p.receta]; if (!r) return;
      (r.items || []).forEach(it => {
        const o = out[it.insumo] || (out[it.insumo] = {total:0, por:[]});
        const c = (Number(it.cant) || 0) * (Number(p.personas) || 0);

    let t = null;
    const saveEq = (campo, val) => { e.equipo = Object.assign({}, e.equipo || {}, { [campo]: Math.max(1, val) }); clearTimeout(t); t = setTimeout(() => { saveEvent(true); render(); }, 600); };
    v.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => { const campo = b.dataset.eq, inp = campo === "personas" ? $("eqN") : $("eqD"); const val = Math.max(1, (parseInt(inp.value, 10) || 0) + Number(b.dataset.d)); inp.value = val; saveEq(campo, val); });
    $("eqN").oninput = () => saveEq("personas", parseInt($("eqN").value, 10) || 1);
    $("eqD").oninput = () => saveEq("dias", parseInt($("eqD").value, 10) || 1);
    v.querySelectorAll("[data-precio]").forEach(b => b.onclick = () => precioSheet(b.dataset.precio));
    v.querySelectorAll("[data-tengo]").forEach(b => b.onclick = () => { const k = b.dataset.tengo; e.tengo = e.tengo || {}; if (e.tengo[k]) delete e.tengo[k]; else e.tengo[k] = true; saveEvent(true); render(); });
    v.querySelectorAll("[data-utok]").forEach(b => b.onclick = () => { const id = b.dataset.utok; e.utOk = e.utOk || {}; if (e.utOk[id]) delete e.utOk[id]; else e.utOk[id] = true; saveEvent(true); render(); });
    v.querySelectorAll("[data-ut]").forEach(b => b.onclick = () => utensilioSheet(b.dataset.ut));
    v.querySelectorAll("[data-rolstep]").forEach(b => b.onclick = () => {
      const id = b.dataset.rolstep; e.personal = e.personal || {}; e.personal.cant = Object.assign({}, e.personal.cant || {});
      e.personal.cant[id] = Math.max(0, personalCant(e, id) + Number(b.dataset.d)); saveEvent(); render();
    });
    v.querySelectorAll("[data-rol]").forEach(b => b.onclick = () => rolSheet(b.dataset.rol));
    const hb = $("horasEdit"); if (hb) hb.onclick = horasSheet;
    const fe = $("fijosEdit"); if (fe) fe.onclick = fijosSheet;
    const fo = $("fijosOff"); if (fo) fo.onclick = () => { if (!confirm("¿Volver a calcular el personal por hora en este evento?")) return; e.personal = Object.assign({}, e.personal || {}); delete e.personal.fijos; saveEvent(true); render(); };
    $("utNew").onclick = () => utensilioSheet(null);
  }

      <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="fjOk">Guardar</button></div>`);
    const pintar = () => { el.querySelector("#fjRows").innerHTML = filas.map((f, i) => `
      <div class="two" style="grid-template-columns:2fr 1fr auto;align-items:end">
        <div class="field"><label for="fjN${i}">Pago</label><input id="fjN${i}" data-fjn="${i}" value="${esc(f.nombre || "")}" placeholder="Ej: Cocineros"></div>
        <div class="field"><label for="fjM${i}">Monto ($)</label><input id="fjM${i}" data-fjm="${i}" type="number" inputmode="decimal" min="0" step="any" value="${f.monto === "" || f.monto == null ? "" : Number(f.monto)}"></div>

  function sheet(html){
    const root = $("sheetRoot");
    root.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const bg = root.firstChild;
    bg.addEventListener("click", ev2 => { if (ev2.target === bg || ev2.target.closest("[data-close]")) closeSheet(); });
    return bg.firstChild;
  }
  function closeSheet(){ $("sheetRoot").innerHTML = ""; }

    const del = el.querySelector("#rDel");
    del.onclick = async () => {
      const usada = Object.values(S.eventos).filter(e => (e.platos||[]).some(p => p.receta === id)).map(e => e.nombre);
      if (!del.dataset.sure){ del.dataset.sure = "1"; del.textContent = usada.length ? `Se usa en ${usada.join(", ")}. Tocá de nuevo para borrar` : "Tocá de nuevo para borrar"; return; }
      closeSheet();
      try { await db.collection("recetas").doc(id).delete(); toast("Receta borrada"); } catch(err){ toast("No se pudo borrar. Probá de nuevo."); }
    };
  }

  // ---------- nueva receta / editar, con control de duplicados ----------
  function findInsumo(name){
    const s = slug(name); if (!s) return null;
    if (S.insumos[s]) return s;
    return Object.keys(S.insumos).find(k => slug(S.insumos[k].nombre) === s) || null;
  }
  function closestInsumo(name){
    const s = slug(name); if (s.length < 3) return null;
    let best = null, bd = 99;
    Object.keys(S.insumos).forEach(k => {
      const d = (k.includes(s) || s.includes(k)) ? 1 : lev(s, k);
      if (d < bd){ bd = d; best = k; }
    });
    return bd <= 2 ? best : null;
  }
  function recetaSheet(id){
    const r = id ? S.recetas[id] : null;
    const draft = { nombre: r ? r.nombre : "", tipo: r ? r.tipo : "veggie", turno: r ? r.turno || "" : "Almuerzo",
      items: r ? (r.items||[]).map(it => ({ nombre: S.insumos[it.insumo]?.nombre || it.insumo, cant: it.cant || "" })) : [{nombre:"", cant:""}], forzar:false };
    const el = sheet(`
      <h2>${r ? "Editar receta" : "Nueva receta"}</h2>
      <div class="field"><label for="rNom">Nombre del plato</label><input id="rNom" value="${esc(draft.nombre)}" placeholder="Ej: Curry de garbanzos"></div>
      <div class="two">
        <div class="field"><label for="rTipo">Tipo</label><select id="rTipo">${Object.entries(TIPOS).map(([k, l]) => `<option value="${k}"${draft.tipo === k ? " selected" : ""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label for="rTurno">Turno</label><select id="rTurno">${["Desayuno","Almuerzo","Cena","Postre",""].map(t => `<option value="${t}"${draft.turno === t ? " selected" : ""}>${t || "Cualquiera"}</option>`).join("")}</select></div>
      </div>
      <div id="dupBox"></div>
      <div class="field"><label>Ingredientes por persona</label><div id="ings" class="group"></div>
        <datalist id="insList">${Object.values(S.insumos).map(i => `<option value="${esc(i.nombre)}">`).join("")}</datalist>
        <button class="btn ghost sm" id="addIng" style="justify-self:start">+ Ingrediente</button>
      </div>
      <div id="errBox"></div>
      <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="rOk">Guardar receta</button></div>`);

    function drawIngs(){
      const box = el.querySelector("#ings");
      box.innerHTML = draft.items.map((it, i) => {
        const k = findInsumo(it.nombre), ins = k ? S.insumos[k] : null;
        const near = !k && it.nombre.trim() ? closestInsumo(it.nombre) : null;
        return `<div class="ing">
          <input list="insList" id="in-${i}" data-i="${i}" data-f="nombre" value="${esc(it.nombre)}" placeholder="Ingrediente" aria-label="Ingrediente ${i+1}">
          <div><input type="number" inputmode="decimal" step="any" min="0" id="ic-${i}" data-i="${i}" data-f="cant" value="${esc(it.cant)}" placeholder="0" aria-label="Cantidad por persona"><div class="unit">${ins ? (ins.unidad === "u" ? esc(plural(ins.etiqueta || "unidad", 2)) : (ins.unidad === "ml" ? "ml" : "gramos")) : (it.unidad === "u" ? "unidades" : it.unidad === "ml" ? "ml" : "gramos")}</div></div>
          <button class="x" data-del="${i}" aria-label="Quitar ingrediente">×</button>
          ${!k && it.nombre.trim() ? `<div class="newi">
            <p>${near ? `Ingrediente nuevo. ¿Es <b>${esc(S.insumos[near].nombre)}</b>? <button class="btn sm ghost" data-use="${i}" data-k="${esc(near)}">Usar ese</button>` : "Ingrediente nuevo: elegí dónde se compra y cómo se mide."}</p>
            <select id="icat-${i}" data-i="${i}" data-f="categoria" aria-label="Categoría">${CATS.map(c => `<option value="${c}"${(it.categoria || "Verduleria") === c ? " selected" : ""}>${CAT_LABEL[c]}</option>`).join("")}</select>
            <select id="iuni-${i}" data-i="${i}" data-f="unidad" aria-label="Se mide en"><option value="g"${!it.unidad || it.unidad === "g" ? " selected" : ""}>Gramos</option><option value="ml"${it.unidad === "ml" ? " selected" : ""}>Mililitros (líquidos)</option><option value="u"${it.unidad === "u" ? " selected" : ""}>Unidades</option></select>
          </div>` : ""}
        </div>`;
      }).join("");
      box.querySelectorAll("[data-f]").forEach(inp => {
        inp.addEventListener(inp.tagName === "SELECT" ? "change" : "input", () => { draft.items[+inp.dataset.i][inp.dataset.f] = inp.value; draft.forzar = false; if (inp.dataset.f === "nombre") debouncedDraw(inp.id); checkDup(); });
      });
      box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { draft.items.splice(+b.dataset.del, 1); if (!draft.items.length) draft.items.push({nombre:"", cant:""}); drawIngs(); checkDup(); });
      box.querySelectorAll("[data-use]").forEach(b => b.onclick = () => { draft.items[+b.dataset.use].nombre = S.insumos[b.dataset.k].nombre; drawIngs(); checkDup(); });
    }
    let drawT = null;
    function debouncedDraw(focusId){ clearTimeout(drawT); drawT = setTimeout(() => { const pos = $(focusId)?.selectionStart; drawIngs(); const f = $(focusId); if (f){ f.focus(); try { f.setSelectionRange(pos, pos); } catch(e3){} } }, 450); }

    function dupInfo(){
      const nom = el.querySelector("#rNom").value.trim();
      const tk = tokens(nom), keyNom = [...tk].sort().join("-");
      const ings = new Set(draft.items.map(it => findInsumo(it.nombre) || slug(it.nombre)).filter(Boolean));
      let exact = null; const similar = [];
      Object.entries(S.recetas).forEach(([rid, rr]) => {
        if (rid === id) return;
        const t2 = tokens(rr.nombre);
        if (keyNom && [...t2].sort().join("-") === keyNom){ exact = [rid, rr]; return; }
        const ns = jaccard(tk, t2);
        const is = ings.size >= 3 ? jaccard(ings, new Set((rr.items||[]).map(x => x.insumo))) : 0;
        if (ns >= 0.67 || is >= 0.8) similar.push({rid, rr, ns, is});
      });
      similar.sort((a, b) => Math.max(b.ns, b.is) - Math.max(a.ns, a.is));
      return { exact, similar: similar.slice(0, 3) };
    }
    function checkDup(){
      const box = el.querySelector("#dupBox"), { exact, similar } = dupInfo();
      if (exact){ box.innerHTML = `<div class="alert err"><b>Ya existe «${esc(exact[1].nombre)}».</b><span>Cambiá el nombre o editá la receta que ya tenés.</span><button class="btn sm ghost" id="goEx" style="justify-self:start">Abrir la que existe</button></div>`; box.querySelector("#goEx").onclick = () => recetaSheet(exact[0]); return; }
      if (similar.length){ box.innerHTML = `<div class="alert warn"><b>Se parece a ${similar.length === 1 ? "una receta" : "recetas"} que ya tenés:</b>${similar.map(s => `<span>· ${esc(s.rr.nombre)}${s.is >= 0.8 ? ` (${Math.round(s.is*100)}% mismos ingredientes)` : ""}</span>`).join("")}<span>Si es otra versión (por ejemplo veggie o con carne), guardala igual.</span></div>`; return; }
      box.innerHTML = "";
    }

    el.querySelector("#rNom").oninput = () => { draft.forzar = false; checkDup(); };
    el.querySelector("#addIng").onclick = () => { draft.items.push({nombre:"", cant:""}); drawIngs(); $("in-" + (draft.items.length - 1)).focus(); };
    drawIngs(); checkDup();

    el.querySelector("#rOk").onclick = async () => {
      const err = el.querySelector("#errBox"); err.innerHTML = "";
      const nombre = el.querySelector("#rNom").value.trim();
      const items = draft.items.filter(it => it.nombre.trim());
      if (!nombre){ err.innerHTML = '<div class="alert err">Poné el nombre del plato.</div>'; return; }
      if (!items.length){ err.innerHTML = '<div class="alert err">Agregá al menos un ingrediente.</div>'; return; }
      const { exact, similar } = dupInfo();
      if (exact){ err.innerHTML = `<div class="alert err">No se guardó: ya existe «${esc(exact[1].nombre)}».</div>`; return; }
      if (similar.length && !draft.forzar){ draft.forzar = true; const b = el.querySelector("#rOk"); b.textContent = "Guardar igual"; err.innerHTML = '<div class="alert warn">Revisá el aviso de arriba. Si es una receta distinta, tocá <b>Guardar igual</b>.</div>'; return; }
      const nuevos = {}, out = [], seen = new Set();
      for (const it of items){
        let k = findInsumo(it.nombre);
        if (!k){ k = slug(it.nombre); if (!nuevos[k]) nuevos[k] = { nombre: it.nombre.trim().toLowerCase(), categoria: it.categoria || "Verduleria", unidad: it.unidad === "u" ? "u" : it.unidad === "ml" ? "ml" : "g", ...(it.unidad === "u" ? { etiqueta:"unidad" } : {}) }; }
        if (seen.has(k)) continue; seen.add(k);
        out.push({ insumo:k, cant: Number(String(it.cant).replace(",", ".")) || 0 });
      }
      const rid = id || slug(nombre) || ("receta-" + Date.now().toString(36));
      const btn = el.querySelector("#rOk"); btn.disabled = true; btn.textContent = "Guardando…";
      try {
        for (const [k, body] of Object.entries(nuevos)) await db.collection("insumos").doc(k).set(body);
        await db.collection("recetas").doc(rid).set({ nombre, tipo: el.querySelector("#rTipo").value, turno: el.querySelector("#rTurno").value, items: out });
        closeSheet(); toast(id ? "Receta guardada" : "Receta agregada");
      } catch(e4){ btn.disabled = false; btn.textContent = "Guardar receta"; err.innerHTML = '<div class="alert err">No se pudo guardar. Revisá la conexión y probá de nuevo.</div>'; }
    };
  }

  // ---------- navegación ----------
  function remember(){ try { localStorage.setItem("cocina-tab", S.tab); if (S.evId) localStorage.setItem("cocina-ev", S.evId); } catch(e){} }
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; remember(); render(); window.scrollTo(0, 0); });
  $("evSel").onchange = () => { S.evId = $("evSel").value; S.open = {}; remember(); render(); };
  $("evNew").onclick = () => { if (db) newEventSheet(); };

  // ---------- datos ----------
  (async () => {
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db){ render(); return; }
    const sub = (col, key) => {
      let first = true;
      db.collection(col).onSnapshot(snap => {
        const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
        if (col === "eventos"){
          // no pisar cambios propios que todavía se están guardando
          // copias editables de todos los eventos; si este evento tiene cambios sin guardar, se conserva la versión local
          Object.keys(m).forEach(k => { m[k] = JSON.parse(JSON.stringify(m[k])); });
          if ((saveTimer || pendiente) && S.eventos[S.evId] && m[S.evId]) m[S.evId] = S.eventos[S.evId];
          // actualizar los eventos "en el lugar": así los botones y casilleros que ya están en pantalla
          // siguen apuntando al mismo evento y ningún cambio se anota sobre una copia vieja
          Object.keys(m).forEach(k => {
            const viejo = S.eventos[k];
            if (viejo && viejo !== m[k]){ Object.keys(viejo).forEach(x => { delete viejo[x]; }); Object.assign(viejo, m[k]); m[k] = viejo; }
          });
        }
        S[key] = m;
        if (first){ first = false; S.loaded++; }
        const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest(".sheet, .stepper, #recQ");
        if (!typing) render();
      }, () => { $("view").innerHTML = '<div class="empty">Se cortó la conexión con tus datos. Recargá la página.</div>'; });
    };
    sub("insumos", "insumos"); sub("recetas", "recetas"); sub("eventos", "eventos"); sub("utensilios", "utensilios"); sub("config", "config");
    downloads = await window.claude.use("downloads");
    render();
  })();
  render();
})();
</script>
