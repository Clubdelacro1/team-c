# Visita la base de Supabase cada 2 días para que el plan gratis no pause el proyecto
# (lo pausa a los 7 días sin uso). Si hace más de 45 días que nadie toca el repo,
# además guarda la fecha en .github/ultima-visita.txt: GitHub apaga las tareas
# programadas de repos sin movimiento por 60 días.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          URL: https://gtkbnbijembffspgwfno.supabase.co
          # Clave pública (la misma que usa la app en index.html)
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          for t in eventos recetas; do
            c=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Accept-Profile: teamc" "$URL/rest/v1/$t?select=id&limit=1")
            echo "$t: HTTP $c"
          done
          [ "$c" = "200" ] || { echo "::error::Supabase no respondió bien (HTTP $c). ¿Está pausado?"; exit 1; }

      - uses: actions/checkout@v4

      - name: Mantener el repo con movimiento
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $((45*86400)) ]; then
            date -u +%F > .github/ultima-visita.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/ultima-visita.txt
            git commit -m "Visita automática a Supabase"
            git push
          fi
